<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Alpha Weekly</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --text: #e8e8ef;
    --text-dim: #8888a0;
    --accent: #f43f5e;
    --accent2: #fb923c;
    --accent-glow: rgba(244, 63, 94, 0.15);
    --green: #22c55e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-size: 1.3rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo-sub { font-size: 0.75rem; color: var(--text-dim); font-weight: 400; }
  .hamburger {
    display: none; cursor: pointer; font-size: 1.5rem;
    background: none; border: none; color: var(--text);
  }
  .layout { display: flex; min-height: calc(100vh - 60px); }
  .sidebar {
    width: 280px; min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    overflow-y: auto; max-height: calc(100vh - 60px);
    position: sticky; top: 60px;
  }
  .sidebar h3 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-dim); margin-bottom: 1rem; padding: 0 0.5rem;
  }
  .sidebar-item {
    display: block; padding: 0.6rem 0.75rem; margin-bottom: 0.25rem;
    border-radius: 8px; cursor: pointer; text-decoration: none;
    color: var(--text); font-size: 0.85rem; transition: all 0.15s;
  }
  .sidebar-item:hover { background: var(--surface2); }
  .sidebar-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
  .sidebar-date { font-size: 0.7rem; color: var(--text-dim); }
  .content {
    flex: 1; max-width: 820px; margin: 0 auto;
    padding: 2.5rem 2rem;
  }
  .content h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
  .content h2 {
    font-size: 1.4rem; font-weight: 700; margin: 2rem 0 1rem;
    padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
  }
  .content h3 { font-size: 1.1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: var(--accent); }
  .content p { margin-bottom: 1rem; color: var(--text); }
  .content ul, .content ol { margin: 0.5rem 0 1rem 1.5rem; }
  .content li { margin-bottom: 0.4rem; }
  .content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  .content a:hover { border-bottom-color: var(--accent); }
  .content code {
    font-family: 'JetBrains Mono', monospace; font-size: 0.85em;
    background: var(--surface2); padding: 0.15em 0.4em; border-radius: 4px;
  }
  .content pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem; overflow-x: auto; margin: 1rem 0;
  }
  .content pre code { background: none; padding: 0; }
  .content blockquote {
    border-left: 3px solid var(--accent); padding-left: 1rem;
    color: var(--text-dim); margin: 1rem 0; font-style: italic;
  }
  .content table {
    width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem;
  }
  .content th, .content td {
    padding: 0.6rem 0.8rem; border: 1px solid var(--border); text-align: left;
  }
  .content th { background: var(--surface); font-weight: 600; }
  .content img { max-width: 100%; border-radius: 8px; }
  .empty-state {
    text-align: center; padding: 4rem 2rem; color: var(--text-dim);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
  @media (max-width: 768px) {
    .hamburger { display: block; }
    .sidebar {
      position: fixed; left: -300px; top: 60px; bottom: 0;
      z-index: 99; transition: left 0.3s;
    }
    .sidebar.open { left: 0; }
    .content { padding: 1.5rem 1rem; }
    .content h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">🎙️ Creator Alpha Weekly</div>
    <div class="logo-sub">Lives · Entretenimento · Creator Economy</div>
  </div>
  <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <h3>Edições</h3>
    <div id="sidebar-list"></div>
  </nav>
  <main class="content" id="content">
    <div class="empty-state">
      <div class="emoji">🎙️</div>
      <h2>Creator Alpha Weekly</h2>
      <p>Selecione um relatório na barra lateral.</p>
    </div>
  </main>
</div>
<script src="marked.min.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const res = await fetch('history.json?' + Date.now());
  const history = await res.json();
  const list = document.getElementById('sidebar-list');
  const content = document.getElementById('content');

  history.forEach(h => {
    const a = document.createElement('a');
    a.className = 'sidebar-item';
    a.href = '?date=' + h.date;
    a.innerHTML = `<div>${h.title || h.date}</div><div class="sidebar-date">${h.date}</div>`;
    if (params.get('date') === h.date) a.classList.add('active');
    a.onclick = e => {
      e.preventDefault();
      window.history.pushState({}, '', '?date=' + h.date);
      loadReport(h);
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      document.querySelector('.sidebar').classList.remove('open');
    };
    list.appendChild(a);
  });

  async function loadReport(h) {
    try {
      const r = await fetch(h.path + '?' + Date.now());
      const md = await r.text();
      content.innerHTML = marked.parse(md);
      content.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      content.scrollTop = 0;
      window.scrollTo(0, 0);
    } catch(e) {
      content.innerHTML = '<p>Erro ao carregar relatório.</p>';
    }
  }

  const dateParam = params.get('date');
  if (dateParam) {
    const h = history.find(x => x.date === dateParam);
    if (h) loadReport(h);
  } else if (history.length > 0) {
    loadReport(history[0]);
    const first = list.querySelector('.sidebar-item');
    if (first) first.classList.add('active');
  }
})();
</script>
</body>
</html>
